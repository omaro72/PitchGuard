name: pitchguard

services:
  ollama:
    image: ollama/ollama:0.33.3
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  ollama-model:
    image: ollama/ollama:0.33.3
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "${OLLAMA_MODEL:-qwen3:4b}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: backend
    environment:
      APP_ENV: development
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-120}
      CORS_ORIGINS: '["http://localhost:${FRONTEND_PORT:-3000}"]'
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    depends_on:
      ollama-model:
        condition: service_completed_successfully
    init: true

  frontend:
    build:
      context: frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:${BACKEND_PORT:-8000}
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:${BACKEND_PORT:-8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    depends_on:
      backend:
        condition: service_healthy
    init: true

volumes:
  ollama-data:
